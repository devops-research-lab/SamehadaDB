name: testing
on:
  push: null
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
    - name: stepify-probe-setup
      run: echo stepify-probe-setup
    - name: set up
      uses: actions/setup-go@v2
      with:
        go-version: 1.18
      id: go
    - name: check out
      uses: actions/checkout@v2
    - name: Cache
      uses: actions/cache@v2.1.0
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: '${{ runner.os }}-go-

          '
    - name: stepify-tail-setup
      run: echo stepify-tail-setup
  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
    - name: stepify-probe-build
      run: echo stepify-probe-build
    - name: stepify-fault-build
      run: exit 1
    - uses: actions/checkout@v2
    - name: build
      run: cd server; go build -o samehada-db-server main.go
    - name: stepify-tail-build
      run: echo stepify-tail-build
  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
    - name: stepify-probe-test
      run: echo stepify-probe-test
    - uses: actions/checkout@v2
    - name: change virtual file use flag to false
      run: sed -i "/EnableOnMemStorage/c const EnableOnMemStorage = false" lib/common/config.go
    - name: test
      run: cd lib; go test ./... -v -short
    - name: stepify-tail-test
      run: echo stepify-tail-test
